# Scanning runs from CI rather than from Sonar's own Automatic Analysis, which
# cannot import a coverage report. The two are mutually exclusive: with
# Automatic Analysis left on, every scan below is rejected rather than merged.
sonar.projectKey=funkadelic_yart
sonar.organization=funkadelic

# The application source and its tests share one tree, so the split is by
# filename. Sonar holds the test files out of sources on the strength of this,
# and reports on them as tests instead of counting them as uncovered code.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# The dataset is a committed asset, not source. At 50,250 rows it is also large
# enough to dominate a scan that has no opinion to offer about it.
sonar.exclusions=src/data/worldcities/cities.json

# Written by `npm run test:coverage`. A missing file here is not an error, it is
# a silent zero, which reads as a coverage collapse rather than as a broken path.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
