# Scanning runs from CI rather than from Sonar's own Automatic Analysis, which
# cannot import a coverage report. The two are mutually exclusive: with
# Automatic Analysis left on, every scan below is rejected rather than merged.
sonar.projectKey=funkadelic_yart
sonar.organization=funkadelic

# The application source and its tests share one tree, so the split is by
# filename. Sonar holds the test files out of sources on the strength of this,
# and reports on them as tests instead of counting them as uncovered code.
#
# src/test/** is listed alongside the filename pattern because the shared
# helpers there are named for what they are rather than ending in .test.ts, so
# the pattern alone leaves them in the source set. The coverage report excludes
# them, so Sonar was counting twenty lines of test scaffolding as uncovered
# application code and reporting 92.9% where the runner reports 98.5%. The two
# exclusion lists have to agree or the gap reappears as an unreachable gate.
#
# **/*.test-d.ts and **/*.d.ts are listed for the same reason. Those are
# type-level assertions the compiler settles and ambient declarations nothing
# executes, so the coverage report excludes them; without the patterns here
# Sonar would read them as main source and count every line of them as
# uncovered.
#
# The agreement the paragraph above requires is asserted rather than trusted:
# src/toolchain.test.ts derives this list from the coverage exclude list and
# fails on any divergence. The two dialects differ only in that Sonar expands
# no braces and roots its patterns at the project rather than at src.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test-d.ts,**/*.d.ts,src/test/**

# Both datasets are committed assets, not source. At 50,250 and 8,945 rows they
# are also large enough to dominate a scan that has no opinion to offer about
# them.
sonar.exclusions=src/data/worldcities/cities.json,src/data/films/films.json

# Written by `npm run test:coverage`. A missing file here is not an error, it is
# a silent zero, which reads as a coverage collapse rather than as a broken path.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The two table containers and the two app roots are near-copies on purpose,
# which the copy detector reads as 198 duplicated lines and fails the gate on.
# The reason and the upgrade trigger are recorded at each of the four files, so
# the duplication stays visible where a reader meets it rather than only here.
# Drop these entries when a third table arrives and the shared state, address
# and request logic is lifted into hooks.
sonar.cpd.exclusions=src/features/CityTable/CityTable.tsx,src/features/FilmTable/FilmTable.tsx,src/App.tsx,src/FilmsApp.tsx
