version: 2

updates:
  # Package manifest at the repository root. Every dev dependency is an exact pin, which
  # "increase-if-necessary" rewrites in place. The two ranges are floors for consumers:
  # the React peer, and react-icons, a caret so a host shares its own copy. A bump inside
  # the caret moves only the lockfile, so the floor stays where it is.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Hold new releases a few days so a hijacked publish is pulled before it is
    # proposed. Security updates bypass this.
    cooldown:
      default-days: 5
      semver-major-days: 14
    # Generated subjects have to be Conventional Commits, same as hand written ones.
    # release-please files the deps and deps-dev types under Dependencies.
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # Grouped so a routine week is two pull requests to review rather than a dozen.
    # Each group is held to minor and patch only. A grouped major is unreviewable: nine
    # of them arrived as one pull request that could not install, because a single held
    # back peer blocked the whole batch and took the other eight down with it. Majors
    # still arrive, one pull request each, so one can be judged and merged without
    # waiting on another.
    #
    # The one exception is the test runner. Its packages are released together and
    # each peers on the runner at an exact version, so a major proposed for one of
    # them alone cannot install either. Listed first, because a dependency lands in
    # the first group it matches.
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Both entries below are held on purpose, so neither is reproposed every week. The
    # first is a decision: TypeScript 7 is the native port compiler, far too large to
    # ride in on a dependency sweep and be read as a routine version bump. The second
    # is a wait, for the reason written beside it. Minor and patch updates to both
    # still arrive as normal.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # This one is blocked rather than judged. ESLint 10 cannot install here at all:
      # eslint-plugin-react declares a peer ceiling of eslint ^9.7 and 7.37.5 is the
      # newest it has published, so npm ci fails on the peer conflict before a single
      # rule runs. The rest of the stack is already ready, react-hooks,
      # typescript-eslint and config-prettier all accept ^10. Drop this entry once
      # eslint-plugin-react publishes a release that accepts eslint 10, and expect
      # @eslint/js to move to 10.x in the same change.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  # Third-party actions used by the workflow are pinned to commit SHAs. A SHA pin is
  # only a live mitigation while something keeps it current, so the action references
  # are watched on the same weekly cadence and refreshed together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    # ci is a hidden changelog type, so an action bump proposes no release.
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
