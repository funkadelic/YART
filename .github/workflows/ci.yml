name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Assert Node major matches .nvmrc
        run: |
          expected="$(tr -d 'v \t\r\n' < .nvmrc)"
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$expected" != "$actual" ]; then
            echo "Node major mismatch: .nvmrc asks for ${expected}, the runner is on ${actual}"
            exit 1
          fi
          echo "Node major ${actual} matches .nvmrc"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
