name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # The Chromium install below now dominates the job: an apt dependency install
    # plus a browser download, one to three minutes on a cold runner, against tens
    # of seconds for everything that ran before it. The suite itself is not the
    # cost, and the accessibility sweep is not either: the jsdom run takes seven
    # seconds locally and the browser run two. Call a green job four minutes with a
    # cold npm cache and a slow mirror, so ten is a little over double the headroom
    # rather than the fifteen times over it this said when the job ended at the
    # build. The runner's own per-test timeout already catches a deadlock inside a
    # test. This covers the hangs it cannot see, in shared setup or teardown or in
    # either install, which would otherwise hold a machine for the six-hour platform
    # default.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar decides what counts as new code from the commit history. A
          # shallow clone leaves it with no blame to read, so every line in the
          # pull request looks new and the new-code gate measures the wrong set.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Assert Node major matches .nvmrc
        run: |
          expected="$(tr -d 'v \t\r\n' < .nvmrc)"
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$expected" != "$actual" ]; then
            echo "Node major mismatch: .nvmrc asks for ${expected}, the runner is on ${actual}"
            exit 1
          fi
          echo "Node major ${actual} matches .nvmrc"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The browser download is the most expensive thing in this job, so it sits
      # behind every cheap gate: a failing lint, typecheck, format check, coverage
      # run or build stops the job before a byte of it is fetched. The jsdom
      # accessibility check already ran inside the Test step, so what follows is
      # the real-engine half of the accessibility gate rather than the whole of it.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Accessibility sweep
        run: npm run test:browser

      # After the sweep, because both of the expensive things this step needs
      # already exist by here: the browser binary the install above fetched, and
      # the build the suite serves rather than produces. Placed before the scan
      # for the same reason the sweep is, so a broken flow reports as itself.
      - name: End-to-end sweep
        run: npm run test:e2e

      # The traces and screenshots the sweep retains are worth keeping only if
      # they can be reached, and a runner's filesystem is gone the moment the
      # job ends. Conditioned on failure because that is the only case that
      # writes any, and it runs even after the step above stops the job.
      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-artifacts
          path: test-results/
          retention-days: 7

      # Last, so a failing test or build reports as itself rather than as an
      # absent coverage report.
      #
      # Skipped for the updater, which runs against the Dependabot secret store
      # rather than the Actions one and so reads an empty token, failing the job
      # on a permissions error that looks like a code problem. Nothing is lost:
      # sonar.sources is src, and a version bump touches only the manifest and
      # the lockfile, so a scan that did authenticate would have nothing to say.
      - name: SonarQube scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
