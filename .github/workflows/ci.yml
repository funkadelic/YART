name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # A green job runs about four minutes, most of it the Chromium install. Ten
    # catches a hang in setup or in either install without holding the machine for
    # the six-hour platform default.
    timeout-minutes: 10
    # A boolean rather than the token, because `secrets` is not an allowed
    # context in a step's `if`. The token itself stays on the one step that
    # needs it, out of the environment of the install and of every action here.
    env:
      HAS_CHROMATIC: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar reads blame to decide what counts as new code. A shallow clone
          # leaves it none, so every line looks new.
          fetch-depth: 0

      # Pull requests only, since a push has no base to diff against. Before the
      # install, so a known advisory stops the job while the change is in review.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Assert Node major matches .nvmrc
        run: |
          expected="$(tr -d 'v \t\r\n' < .nvmrc)"
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$expected" != "$actual" ]; then
            echo "Node major mismatch: .nvmrc asks for ${expected}, the runner is on ${actual}"
            exit 1
          fi
          echo "Node major ${actual} matches .nvmrc"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The browser download is the most expensive thing here, so it sits behind
      # every cheap gate. The jsdom half of the accessibility gate ran in Test.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Accessibility sweep
        run: npm run test:browser

      # After the sweep, which leaves both things this needs in place: the browser
      # binary and the build. Before the scan, so a broken flow reports as itself.
      - name: End-to-end sweep
        run: npm run test:e2e

      # A runner's filesystem is gone when the job ends. Only a failure writes
      # traces, and failure() still runs after the step above stops the job.
      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-artifacts
          path: test-results/
          retention-days: 7

      # Sends the report the test step wrote, from here so a failing gate
      # reports as itself. Skipped for the updater, which reads an empty token.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          # Otherwise the pull request waits on a status that never arrives.
          fail_ci_if_error: true

      # Runs even after a red step, because a failed suite is the run flake
      # detection needs to see. The directory is searched rather than the three
      # reports named, so a run that stopped early uploads what it wrote, and the
      # file check skips the step when it wrote nothing.
      #
      # Every report carries junit in its file name because the uploader matches
      # names against *junit*.xml and reads the directory name as nothing.
      # Measured: without it the step finds zero files, uploads nothing, and
      # still exits green under fail_ci_if_error.
      #
      # The same action as the step above; codecov/test-results-action would be a
      # second action to pin for an input this one already takes.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && hashFiles('junit/*.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          directory: junit
          fail_ci_if_error: true

      # The CLI rather than @codecov/vite-plugin, which peers vite 4, 5 and 6 and
      # will not install beside this tree's vite 8 (upstream issue #264). It
      # reports asset sizes and not the per-module breakdown the plugin gets from
      # bundler hooks.
      #
      # Without the normalize pattern every build reports a full set of new
      # assets, because the assets here are content-hashed and the analyzer's
      # fallback matcher only recognizes a hex hash. Keep the pattern in step with
      # the bundler's asset file names.
      - name: Upload bundle stats to Codecov
        if: github.actor != 'dependabot[bot]'
        run: >-
          npx bundle-analyzer ./dist
          --bundle-name=yart
          --upload-token=${{ secrets.CODECOV_TOKEN }}
          --normalize-assets-pattern="[name]-[hash].js"

      # After the sweeps, so a failing test reports as itself rather than as an
      # absent coverage report. Skipped for the updater, whose empty token would
      # fail the job; a version bump touches no source for the scan to read.
      - name: SonarQube scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Last, so the deploy gets a bundle that cleared every gate. The `if` carries
      # no status function, which keeps the implicit success(). Pushes to main only,
      # so a pull request builds and publishes nothing.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      # Last, because every step above carries no status function and so inherits
      # success(): a Chromatic failure placed earlier would skip the two uploads,
      # the scan and the Pages artifact. It reads the archives the end-to-end
      # sweep already wrote, so it rebuilds and re-runs nothing.
      #
      # Pull requests and main only. Both event types fire on a branch with an
      # open pull request, in different concurrency groups, so without this every
      # commit is captured and metered twice.
      #
      # Exits once the build is uploaded rather than waiting out the capture, so
      # a slow queue cannot spend the job's budget. The accept gate is
      # Chromatic's own pull request check rather than this exit code. The token
      # is guarded rather than the actor, because this repository is public and a
      # fork pull request gets no secret at all.
      #
      # The action rather than the CLI, because on a pull request the checkout is
      # a merge ref and the CLI files the build against a commit that exists in
      # no branch and is later collected. The action reads the head commit off
      # the event payload. It carries its own copy of the CLI, so keep this pin
      # and the one in package.json on the same version.
      - name: Chromatic
        if: >-
          env.HAS_CHROMATIC == 'true'
          && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          playwright: true
          exitOnceUploaded: true
          # A build on the baseline branch does not accept its own snapshots.
          # Without this they stay unreviewed, and a later pull request finds no
          # accepted ancestor to compare against, so it re-reports every one.
          autoAcceptChanges: main

  # A job rather than its own workflow, because `needs` is what makes the publish
  # wait on the gate. The write permissions sit here so the job running untrusted
  # pull request code keeps its read-only token.
  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishes the artifact verify uploaded, so the site and the gate cannot
      # describe different commits.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
