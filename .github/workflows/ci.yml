name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # A green run takes well under a minute, so this is roughly fifteen times the
    # headroom a cold cache needs. The runner's own per-test timeout already catches
    # a deadlock inside a test. This covers the hangs it cannot see, in shared setup
    # or teardown or in the install itself, which would otherwise hold a machine for
    # the six-hour platform default.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar decides what counts as new code from the commit history. A
          # shallow clone leaves it with no blame to read, so every line in the
          # pull request looks new and the new-code gate measures the wrong set.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Assert Node major matches .nvmrc
        run: |
          expected="$(tr -d 'v \t\r\n' < .nvmrc)"
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$expected" != "$actual" ]; then
            echo "Node major mismatch: .nvmrc asks for ${expected}, the runner is on ${actual}"
            exit 1
          fi
          echo "Node major ${actual} matches .nvmrc"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The browser download is the most expensive thing in this job, so it sits
      # behind every cheap gate: a failing lint, typecheck, format check, coverage
      # run or build stops the job before a byte of it is fetched. The jsdom
      # accessibility check already ran inside the Test step, so what follows is
      # the real-engine half of the accessibility gate rather than the whole of it.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Accessibility sweep
        run: npm run test:browser

      # Last, so a failing test or build reports as itself rather than as an
      # absent coverage report.
      #
      # Skipped for the updater, which runs against the Dependabot secret store
      # rather than the Actions one and so reads an empty token, failing the job
      # on a permissions error that looks like a code problem. Nothing is lost:
      # sonar.sources is src, and a version bump touches only the manifest and
      # the lockfile, so a scan that did authenticate would have nothing to say.
      - name: SonarQube scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
